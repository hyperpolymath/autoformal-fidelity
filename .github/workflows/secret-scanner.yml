# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (+ a Rust-secrets
# check). An inline TruffleHog job previously lived here, but the reusable
# DELIBERATELY retired TruffleHog as redundant (gitleaks gives sufficient
# coverage at lower cost — see the reusable's header). Re-adding it was
# duplicated work, not extra coverage, so it has been removed. See
# .github/workflows/README.adoc.
jobs:
  scan:
    # The reusable installs and executes a pinned gitleaks binary directly.
    # Keep this job-level block explicit: it replaces the workflow-level grant
    # and is therefore the cap GitHub applies to the called workflow.
    #
    # actions: read is granted here as well as contents: read. With
    # contents: read alone, every run of this workflow ended at startup with
    # zero jobs (16 of 16 runs up to 2026-11-11), so the required
    # `scan / gitleaks` context was never reported. The other callers of this
    # standards pin grant actions: read for the reusable's staleness check.
    # Drop it again only when the pin moves to a standards commit whose
    # secret-scanner reusable no longer asks for it (standards#500).
    permissions:
      actions: read
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
